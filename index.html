function displayBoazMatches() {
  const now = new Date();

  const upcoming = boazMatches.filter(match => {
    const kickoff = new Date(
      `${match.date}T${match.time}:00+03:00`
    );
    return kickoff > now;
  });

  const container = document.getElementById("boaz-match-list");

  if (!container) return;

  if (upcoming.length === 0) {
    container.innerHTML =
      '<p style="text-align:center;color:white">No upcoming scheduled matches.</p>';
    return;
  }

  const days = {};

  upcoming.forEach(match => {
    if (!days[match.date]) days[match.date] = [];
    days[match.date].push(match);
  });

  container.innerHTML = Object.keys(days).map(date => {
    const dayTitle = new Date(date + "T12:00:00")
      .toLocaleDateString("en-GB", {
        weekday:"long",
        day:"numeric",
        month:"long",
        timeZone:"UTC"
      });

    return `
      <h3 class="match-day">📅 ${dayTitle}</h3>
      ${days[date].map(m => `
        <div class="match-card">
          <div class="league">🏆 ${m.league}</div>
          <div class="kickoff">🕒 Kick-off: ${m.time} EAT</div>
          <div class="teams">
            ${m.home} <span style="color:#00ff41">VS</span> ${m.away}
          </div>
          <div class="prediction">
            Correct Score: ${m.score}
          </div>
          <div class="details">
            ⚽ Over 1.5 Goals: <b>${m.o15}</b><br>
            ⚽ Over 2.5 Goals: <b>${m.o25}</b><br>
            🤝 BTTS: <b>${m.btts}</b>
          </div>
        </div>
      `).join("")}
    `;
  }).join("");
}

displayBoazMatches();
